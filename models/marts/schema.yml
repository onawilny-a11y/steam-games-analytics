version 2

models:
  - name: daily_sales
    description: "Daily sales data for each game, including revenue and transaction metrics."
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: daily_sales_key
    columns:
      - name: game_id
        description: "Primary key. Unique identifier for each game."
        tests:
          - unique
          - not_null
      - name: game_title
        description: "Official title of the game."
        tests:
          - not_null